$kind: http-request
url: "{{baseUrl}}/"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response is a string\", function () {\r

      \    pm.expect(pm.response.text()).to.be.a(\"string\");\r

      });\r

      \r

      /*pm.test(\"Response message is correct\", function () {\r

      \    pm.expect(pm.response.text()).to.eql(\"AI Finance Coach API\");\r

      });*/\r

      \r

      pm.test(\"Response time is acceptable\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(1000);\r

      });"
    language: text/javascript
order: 1000
